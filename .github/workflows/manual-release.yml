name: Republish packages

on:
  workflow_dispatch:

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  republish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: yarn
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn bootstrap

      - name: Build packages
        run: |
          yarn build
          git diff --exit-code || {
            echo 'Найдены изменения в отслеживаемых файлах после yarn build'
            exit 127
          }

      - name: Publish missing packages
        run: yarn lerna publish from-package --yes
        env:
          GH_TOKEN: ${{ secrets.TRAMVAI_GH_PAGES_PAT }}
